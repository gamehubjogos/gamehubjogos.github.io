<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>GameHub</title>
  <script>
    (function () {
      var mobile = window.matchMedia('(max-width: 680px)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      document.documentElement.classList.add(mobile ? 'device-mobile' : 'device-desktop');
    }());
  </script>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <style>
    :root { color-scheme: dark; }
    html.device-desktop .mobile-gate { display: none !important; }
    html.device-mobile .mobile-gate[hidden] { display: none !important; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    html, body, button, a, img, iframe { -webkit-tap-highlight-color: transparent; }
    body, button, a, img, iframe { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
    button, a { outline: none; }
    body.game-page { margin: 0; background: #000; color: #fff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .game-page-shell { width: min(1280px, 100%); margin: 0 auto; padding: 20px 18px 44px; }
    .game-page-nav { display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
    .game-page-logo { color: #fff; text-decoration: none; font-family: "Arial Black", Inter, sans-serif; font-size: clamp(1.2rem, 3vw, 1.7rem); font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .game-showcase { position: relative; overflow: hidden; width: min(68vw, 760px); min-width: 520px; aspect-ratio: 16 / 10; max-height: calc(100svh - 150px); margin: 0 auto; background: #000; box-shadow: 0 18px 50px rgba(0,0,0,.42); }
    .game-cover { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; isolation: isolate; background: #050505; cursor: pointer; }
    .game-cover::before { position: absolute; inset: -30px; z-index: -2; background-image: var(--cover-image); background-position: center; background-size: cover; filter: blur(28px) brightness(.3) saturate(1.15); transform: scale(1.12); content: ""; }
    .game-cover::after { position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at center, rgba(0,0,0,.05), rgba(0,0,0,.84) 90%); content: ""; }
    .game-cover-image { width: min(62%, 620px); height: min(90%, 620px); aspect-ratio: 1 / 1; object-fit: cover; border: 1px solid rgba(255,255,255,.16); border-radius: 18px; filter: drop-shadow(0 20px 38px rgba(0,0,0,.78)); }
    .game-cover-content { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
    .game-cover-content h2, .game-cover-content p { position: absolute; overflow: hidden; width: 1px; height: 1px; clip: rect(0 0 0 0); white-space: nowrap; }
    .play-button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 142px; min-height: 56px; border: 2px solid #fff; border-radius: 999px; color: #000; background: #fff; cursor: pointer; pointer-events: auto; font: inherit; font-size: 1rem; font-weight: 900; box-shadow: 0 12px 34px rgba(0,0,0,.55); transition: transform .18s ease, background .18s ease, box-shadow .18s ease; }
    .play-button:hover, .play-button:focus-visible { background: #f1f1f1; box-shadow: 0 16px 40px rgba(0,0,0,.65); outline: none; transform: scale(1.04); }
    .play-button:active { transform: scale(.97); }
    .play-symbol { font-size: 1.05rem; }
    .minecraft-chooser { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 32px; background: rgba(0,0,0,.68); backdrop-filter: blur(12px); pointer-events: auto; }
    .minecraft-chooser[hidden] { display: none; }
    .version-chooser-title { flex-basis: 100%; margin-bottom: 2px; color: #fff; font-family: "Arial Black", Inter, sans-serif; font-size: clamp(1rem, 2.4vw, 1.45rem); letter-spacing: .01em; text-align: center; }
    .version-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; }
    .version-button { min-width: 112px; padding: 13px 18px; border: 1px solid #3a3a3a; border-radius: 12px; color: #fff; background: #151515; box-shadow: 0 8px 20px rgba(0,0,0,.28); cursor: pointer; font: inherit; font-size: .9rem; font-weight: 800; transition: border-color .18s ease, background .18s ease, transform .18s ease; }
    .version-button:hover, .version-button:focus-visible { border-color: #fff; background: #252525; outline: none; transform: translateY(-2px); }
    .version-button:active { transform: translateY(0) scale(.97); }
    .game-stage { position: absolute; inset: 0; display: none; background: #000; }
    .game-stage.is-active { display: block; }
    .mobile-gate { display: none; position: absolute; inset: 0; z-index: 4; align-items: center; justify-content: center; flex-direction: column; gap: 16px; padding: 22px; background: #050505; text-align: center; }
    .mobile-gate-image { width: min(58vw, 250px); height: min(58vw, 250px); aspect-ratio: 1 / 1; object-fit: cover; border-radius: 14px; filter: drop-shadow(0 18px 34px rgba(0,0,0,.72)); }
    .mobile-gate-message { max-width: 270px; color: #fff; font-size: .95rem; font-weight: 800; line-height: 1.35; }
    .mobile-gate-hint { color: #a9a9a9; font-size: .78rem; }
    .mobile-gate[hidden] { display: none; }
    #gameFrame { display: block; width: 100%; height: 100%; border: 0; background: #000; outline: none; -webkit-tap-highlight-color: transparent; }
    .game-status { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; color: #d7d7d7; background: #000; text-align: center; }
    .game-status.is-loading { place-items: center; gap: 14px; color: rgba(255,255,255,.9); background: #030303; font-size: .82rem; font-weight: 700; pointer-events: none; text-shadow: 0 2px 12px #000; }
    .game-status.is-loading::before { width: 28px; height: 28px; border: 4px solid #f1f1f1; border-top-color: #3f3f3f; border-radius: 50%; animation: gamehub-player-spin .8s linear infinite; content: ""; }
    @keyframes gamehub-player-spin { to { transform: rotate(360deg); } }
    .game-status.is-hidden { display: none; }
    .game-status.error { padding: 20px; color: #ffb5b5; }
    .related-section { margin-top: 42px; }
    .related-section h2 { margin: 0 0 16px; color: #fff; font-size: 1.3rem; }
    .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
    .related-card { overflow: hidden; border: 1px solid #202020; border-radius: 12px; color: #fff; background: #0b0b0b; text-decoration: none; transition: transform .18s ease, border-color .18s ease; }
    .related-card:hover, .related-card:focus-visible { border-color: #555; outline: none; transform: translateY(-3px); }
    .related-card img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: #050505; }
    .related-card span { display: block; overflow: hidden; padding: 11px 12px 13px; color: #f4f4f4; font-size: .86rem; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    body.game-page.is-playing { overflow: hidden; }
    body.game-page.is-playing .game-page-shell { width: 100%; max-width: none; padding: 0; }
    body.game-page.is-playing .game-page-nav, body.game-page.is-playing .related-section { display: none; }
    body.game-page.is-playing .game-showcase { position: fixed; inset: 0; z-index: 10; width: 100vw; height: 100svh; max-height: none; aspect-ratio: auto; margin: 0; box-shadow: none; }
    body.game-page.resume-required .mobile-gate { position: fixed !important; inset: 0 !important; z-index: 30; display: flex !important; width: 100vw; height: 100svh; min-height: 100svh; background: #050505; }
    body.game-page.resume-required .game-showcase { overflow: visible; }
    body.game-page.resume-required .game-stage { display: none !important; }

    @media (max-width: 680px) {
      .game-page-shell { padding: 14px 10px 34px; }
      .game-page-nav { margin-bottom: 14px; }
      .game-showcase { width: 100%; min-width: 0; height: auto; aspect-ratio: auto; max-height: none; }
      .game-showcase.has-minecraft-chooser { aspect-ratio: auto; min-height: 0; }
      .game-showcase .game-cover { display: none; }
      .game-showcase .mobile-gate { position: relative; inset: auto; display: flex; min-height: 0; height: auto; }
      .game-showcase .mobile-gate .minecraft-chooser { position: static; inset: auto; width: 100%; padding: 0; background: transparent; backdrop-filter: none; }
      .game-showcase .mobile-gate .version-chooser-title { margin-top: 2px; font-size: .95rem; }
      .game-showcase .mobile-gate .version-button { min-width: 92px; padding: 11px 12px; font-size: .8rem; }
      .game-showcase .mobile-gate.is-minecraft-chooser { justify-content: flex-start; gap: 10px; padding: 18px 14px; overflow-y: auto; }
      .game-showcase .mobile-gate.is-minecraft-chooser .mobile-gate-image { width: min(38vw, 145px); height: min(38vw, 145px); }
      .game-showcase .mobile-gate.is-minecraft-chooser .mobile-gate-message { display: none; }
      .game-showcase .mobile-gate.is-minecraft-chooser .minecraft-chooser { display: block; overflow: hidden; }
      .game-showcase .mobile-gate.is-minecraft-chooser .version-chooser-title { font-size: .88rem; }
      .game-showcase .mobile-gate.is-minecraft-chooser .version-options { flex-wrap: nowrap; justify-content: flex-start; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scroll-snap-type: x mandatory; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
      .game-showcase .mobile-gate.is-minecraft-chooser .version-button { flex: 0 0 min(29vw, 112px); min-width: 0; padding: 10px 4px; font-size: .76rem; scroll-snap-align: start; }
      .game-showcase.is-fullscreen-mobile .mobile-gate { display: none; }
      .game-showcase.is-fullscreen-mobile .game-stage.is-active { display: block; }
      .game-showcase:not(.is-fullscreen-mobile) .game-stage { display: none !important; }
      .game-showcase:fullscreen { width: 100vw; height: 100svh; max-height: none; aspect-ratio: auto; margin: 0; }
      .game-showcase:-webkit-full-screen { width: 100vw; height: 100svh; max-height: none; aspect-ratio: auto; margin: 0; }
      .game-cover-image { width: min(72%, 330px); height: auto; aspect-ratio: 1 / 1; border-radius: 12px; object-fit: cover; }
      .play-button { min-width: 128px; min-height: 50px; font-size: .95rem; }
      .related-section { margin-top: 32px; }
      .related-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .related-card img { aspect-ratio: 16 / 10; }
    }
  </style>
</head>
<body class="game-page">
  <main class="game-page-shell">
    <nav class="game-page-nav" aria-label="GameHub navigation">
      <a id="backToGameHub" class="game-page-logo" href="./">GAMEHUB</a>
    </nav>
    <h1 id="gamePageTitle" class="sr-only">Loading game...</h1>
    <p id="gamePageSubtitle" class="sr-only">Play instantly in GameHub</p>
    <section id="gameShowcase" class="game-showcase" aria-label="Game player">
      <div id="gameCover" class="game-cover">
        <img id="gameCoverImage" class="game-cover-image" alt="" width="600" height="600">
        <div class="game-cover-content">
          <h2 id="gameCoverTitle">Loading game...</h2>
          <p>Play now in your browser</p>
          <button id="playButton" class="play-button" type="button"><span class="play-symbol" aria-hidden="true">▶</span> Play</button>
          <div id="minecraftChooser" class="minecraft-chooser" hidden aria-label="Choose a Minecraft version">
            <div class="version-chooser-title">Choose your Minecraft version</div>
            <div class="version-options">
              <button class="version-button" type="button" data-minecraft-version="1.5.2.html">1.5.2</button>
              <button class="version-button" type="button" data-minecraft-version="1.8.8.html">1.8.8</button>
              <button class="version-button" type="button" data-minecraft-version="1.12.2.html">1.12.2</button>
              <button class="version-button" type="button" data-minecraft-version="1.26.2.html">1.26.2</button>
            </div>
          </div>
        </div>
      </div>
      <div id="mobileGate" class="mobile-gate" hidden>
        <img id="mobileGateImage" class="mobile-gate-image" alt="">
        <div id="mobileGateMessage" class="mobile-gate-message">Tap Play to enter fullscreen</div>
        <button id="mobilePlayButton" class="play-button" type="button"><span class="play-symbol" aria-hidden="true">▶</span> Play</button>
                  <div id="mobileMinecraftChooser" class="minecraft-chooser" hidden aria-label="Choose a Minecraft version on mobile">
          <div class="version-chooser-title">Choose your Minecraft version</div>
          <div class="version-options">
            <button class="version-button" type="button" data-minecraft-version="1.5.2.html">1.5.2</button>
            <button class="version-button" type="button" data-minecraft-version="1.8.8.html">1.8.8</button>
            <button class="version-button" type="button" data-minecraft-version="1.12.2.html">1.12.2</button>
            <button class="version-button" type="button" data-minecraft-version="1.26.2.html">1.26.2</button>
          </div>
        </div>
      </div>
      <div id="gameStage" class="game-stage">
        <div id="gameStatus" class="game-status">Loading game...</div>
        <iframe id="gameFrame" title="Game" allow="autoplay; gamepad; pointer-lock; fullscreen" allowfullscreen></iframe>
      </div>
    </section>
    <section id="relatedSection" class="related-section" hidden aria-labelledby="relatedTitle">
      <h2 id="relatedTitle">Games You May Like</h2>
      <div id="relatedGames" class="related-grid"></div>
    </section>
  </main>
  <script src="asset-host.js"></script>
  <script src="play.js"></script>
</body>
</html>
